<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>KivaFlow</title>
    <style>body { background: #F7F5F0; }</style>
    <!-- Streamlit dentro del navegador (stlite): el mismo app.py, sin servidor. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";

      // Cambiar VERSION en cada publicación: evita que el navegador mezcle archivos viejos (caché).
      const VERSION = "2026-10-19.4";
      // Raíz del sitio (GitHub Pages lo sirve en /kivaflow/). Las URLs son absolutas para que
      // también funcione al entrar directo a /kivaflow/explorar (lo atiende 404.html).
      const RAIZ = location.pathname.startsWith("/kivaflow/") ? "/kivaflow/" : "/";
      const archivos = [
        "app.py",
        "kivaflow/__init__.py", "kivaflow/config.py", "kivaflow/layout.py", "kivaflow/demanda.py",
        "kivaflow/trafico.py", "kivaflow/grafo.py", "kivaflow/bfs.py", "kivaflow/bellman_ford.py",
        "kivaflow/edmonds_karp.py", "kivaflow/pedido.py", "kivaflow/visual.py",
        "kivaflow/simulacion.py", "kivaflow/interactivo.py", "kivaflow/paleta.py", "kivaflow/verificacion.py",
        "data/nodos.csv", "data/aristas.csv", "data/skus.csv",
        "resultados/resumen.md", "resultados/verificacion.json", "resultados/ruta_ejemplo.png", "resultados/cuellos_de_botella.png",
      ];

      mount(
        {
          requirements: ["networkx", "matplotlib", "plotly==6.9.0"],
          entrypoint: "app.py",
          files: Object.fromEntries(archivos.map((ruta) => [ruta, { url: `${location.origin}${RAIZ}${ruta}?v=${VERSION}` }])),
          streamlitConfig: {
            "client.toolbarMode": "viewer",
            "theme.base": "light",
            "theme.primaryColor": "#1F2328",
            "theme.backgroundColor": "#F7F5F0",
            "theme.secondaryBackgroundColor": "#EFEBE3",
            "theme.textColor": "#1F2328",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
